name: Deploy to Server (chuckfan.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          grep -q '/assets/' dist/index.html && echo "OK: index.html 引用 /assets/ 构建产物"
          grep -q 'main.jsx' dist/index.html && (echo "ERROR: index.html 仍含 main.jsx，构建异常"; exit 1) || true

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

      - name: Add server to known hosts
        run: ssh-keyscan -H 154.17.3.182 >> ~/.ssh/known_hosts

      - name: Clear remote directory
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=no root@154.17.3.182 \
            "rm -rf /root/projects/chuck/* 2>/dev/null; mkdir -p /root/projects/chuck"

      - name: Deploy to server
        run: |
          scp -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=no -r dist/* root@154.17.3.182:/root/projects/chuck/

      - name: Deploy tournament (tournament.chuckfan.com)
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=no root@154.17.3.182 \
            "mkdir -p /root/projects/tournament"
          scp -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=no -r tournament/* root@154.17.3.182:/root/projects/tournament/

      - name: Reload Nginx
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=no root@154.17.3.182 \
            "chmod -R 755 /root/projects/chuck /root/projects/tournament && (nginx -t && systemctl reload nginx || true)"

      - name: Verify deployed index on server
        run: |
          echo "=== 服务器上的 index.html 前 12 行 ==="
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=no root@154.17.3.182 \
            "head -12 /root/projects/chuck/index.html"
